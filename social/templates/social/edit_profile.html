<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | ConnectHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #4f46e5;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            width: 500px;
            max-width: 95%;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            color: #4f46e5;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            width: 100%;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .current-picture {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
        }

        .messages {
            color: #15803d;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2 style="color:white; margin:0;">ConnectHub</h2>

    <div>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'profile' user.username %}">My Profile</a>
    </div>
</div>

<div class="container">

    <h2>Edit Your Profile ✨</h2>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    {% if profile.profile_picture %}
        <p>Current profile picture:</p>
        <img
            src="{{ profile.profile_picture.url }}"
            alt="Current profile picture"
            class="current-picture"
        >
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            value="{{ user.username }}"
            maxlength="150"
            required
        >

        <label for="bio">About You</label>
        <textarea
            id="bio"
            name="bio"
            maxlength="500"
            placeholder="Tell people something about yourself..."
        >{{ profile.bio }}</textarea>

        <label for="profile_picture">Profile Picture</label>
        <input
            type="file"
            id="profile_picture"
            name="profile_picture"
            accept="image/*"
        >

        <button type="submit">Save Changes</button>
    </form>

</div>

</body>
</html>
