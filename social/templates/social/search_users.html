<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Users | ConnectHub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #4f46e5;
            color: white;
            padding: 18px 30px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 600px;
            max-width: 95%;
            margin: 30px auto;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        .user-card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .user-card a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="navbar">
    <strong>ConnectHub</strong>
    &nbsp;&nbsp;
    <a href="{% url 'home' %}">Home</a>
</div>

<div class="container">

    <h2>🔍 Find People</h2>

    <form method="GET" action="{% url 'search_users' %}">
        <input
            type="text"
            name="q"
            placeholder="Search by username..."
            value="{{ query }}"
        >

        <button type="submit">Search</button>
    </form>

    {% if query %}

        {% for person in users %}

            <div class="user-card">
                👤
                <a href="{% url 'profile' person.username %}">
                    @{{ person.username }}
                </a>
            </div>

        {% empty %}

            <p>No users found for "{{ query }}".</p>

        {% endfor %}

    {% else %}

        <p>Enter a username to find people on ConnectHub.</p>

    {% endif %}

</div>

</body>
</html>
